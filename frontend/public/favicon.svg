<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#08090B"/>
  <polygon points="50,15 85,35 85,75 50,92 15,75 15,35" fill="none" stroke="url(#cyberGrad)" stroke-width="4" filter="url(#glow)"/>
  <text x="50" y="58" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" fill="#22D3EE" text-anchor="middle" dominant-baseline="central">AS</text>
  <circle cx="50" cy="50" r="3" fill="#8B5CF6" filter="url(#glow)"/>
</svg>